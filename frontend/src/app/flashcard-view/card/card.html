<div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100vw; height: 80vh;">
  <!-- Added max-width: 600px to cap the width on desktop screens -->
  <div (click)="flipCard(card)" class="flip-container" style="width: 90%; max-width: 600px; height: 90%;">
    <div #card class="flip-card" id="myCard" style="width: 100%; height: 100%;">
      <div class="flip-card-front"><p>{{ cardModel?.front }}</p></div>
      <div class="flip-card-back"><p>{{ cardModel?.back  }}</p></div>
    </div>
  </div>
</div>
